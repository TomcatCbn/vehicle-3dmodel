[package]
name = "vehicle-simulator"
version = "0.1.0"
edition = "2021"
description = "Vehicle signal simulator platform"

[lib]
name = "vehicle_simulator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
# M3 file transfer
tauri-plugin-dialog = "2"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
